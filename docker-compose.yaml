x-airflow-common: &airflow-common
  build: ./airflow_project
  environment: &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}"
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: "${AIRFLOW__CORE__SQL_ALCHEMY_CONN}"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: "statsd-exporter"
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: "airflow"
  volumes:
    - ./airflow_project/dags:/opt/airflow/dags
    - ./airflow_project/logs:/opt/airflow/logs
    - ./airflow_project/plugins:/opt/airflow/plugins
    - type: bind
      source: ./airflow_project/clean_data
      target: /app/clean_data
    - type: bind
      source: ./airflow_project/raw_files
      target: /app/raw_files
  user: "1000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  mongodb:
    image: mongo:6.0
    container_name: local_mongo_db
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      retries: 5
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    environment:
      - AIRFLOW__METRICS__STATSD_ON=true
      - AIRFLOW__METRICS__STATSD_HOST=statsd-exporter
      - AIRFLOW__METRICS__STATSD_PORT=9125
      - AIRFLOW__METRICS__STATSD_PREFIX=airflow
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    environment:
      - AIRFLOW__METRICS__STATSD_ON=true
      - AIRFLOW__METRICS__STATSD_HOST=statsd-exporter
      - AIRFLOW__METRICS__STATSD_PORT=9125
      - AIRFLOW__METRICS__STATSD_PREFIX=airflow
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"'
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "${_AIRFLOW_WWW_USER_USERNAME:-$AIRFLOW_USER}"
      _AIRFLOW_WWW_USER_PASSWORD: "${_AIRFLOW_WWW_USER_PASSWORD:-$AIRFLOW_PASSWORD}"

  fastapi-service:
    build: ./fastapi_app
    container_name: airflow-fastapi
    ports:
      - "8081:8081"
    environment:
      AIRFLOW_BASE_URL: "http://airflow-webserver:8080/api/v1"
      MONGO_HOST: "mongodb"
      MONGO_PORT: "27017"
      API_SECRET_KEY: ${API_SECRET_KEY}
    volumes:
      - ./fastapi_app:/app
    depends_on:
      - mongodb
    command: uvicorn main:app --host 0.0.0.0 --port 8081 --reload
    restart: always

  dashboard:
    build: ./dashboard
    container_name: job_market_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
      - ./airflow_project/dags/scripts/tech_jobs_dictionary.json:/app/tech_jobs_dictionary.json
    depends_on:
      - mongodb
    restart: unless-stopped

  # 1. StatsD Exporter (Receives metric packets from Airflow)
  statsd-exporter:
    image: prom/statsd-exporter:latest
    ports:
      - "9125:9125/udp"
      - "9125:9125/tcp"
      - "9102:9102"
    restart: always

  # 2. MongoDB Exporter (Queries Mongo for internal stats)
  mongo-exporter:
    image: percona/mongodb_exporter:0.54.0
    ports:
      - "9216:9216"
    environment:
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@local_mongo_db:27017/
    depends_on: 
      - mongodb
    restart: always

  # 3. cAdvisor (Introspects Docker containers for resource usage)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8082:8080" # Changed host port to 8082 to avoid conflict with fastapi-service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: always

  # 4. Prometheus (Scrapes the exporters)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      # Maps your local config file into the container
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always

volumes:
  postgres-db-volume:
  mongo_data:
  grafana_data:
