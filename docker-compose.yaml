x-airflow-common: &airflow-common
  build: ./airflow_project
  env_file:
    - .env
  volumes:
    - ./airflow_project/dags:/opt/airflow/dags
    - ./airflow_project/logs:/opt/airflow/logs
    - ./airflow_project/plugins:/opt/airflow/plugins
    - type: bind
      source: ./airflow_project/clean_data
      target: /app/clean_data
    - type: bind
      source: ./airflow_project/raw_files
      target: /app/raw_files
  user: "1000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  mongodb:
    image: mongo:6.0
    container_name: local_mongo_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"',
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
  fastapi-service:
    build: ./fastapi_app
    container_name: airflow-fastapi
    ports:
      - "8081:8081"
    env_file:
    - .env
    environment:
      AIRFLOW_BASE_URL: "http://airflow-webserver:8080/api/v1"
      MONGO_HOST: "mongodb"
      MONGO_PORT: "27017"
    volumes:
      - ./fastapi_app:/app
    depends_on:
      - mongodb
    command: uvicorn main:app --host 0.0.0.0 --port 8081 --reload
    restart: always
  dashboard:
      build: ./dashboard
      container_name: job_market_dashboard
      ports:
        - "8501:8501"
      env_file:
      - .env
      volumes:
        - ./dashboard:/app
        - ./airflow_project/dags/scripts/tech_jobs_dictionary.json:/app/tech_jobs_dictionary.json
      depends_on:
        - mongodb
      restart: unless-stopped

volumes:
  postgres-db-volume:
  mongo_data:
